<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Worksheet Live</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEnCi2w8q28jDL9khfZxR8m6Mu6GtQeN0",
  authDomain: "ai-worksheet-g7.firebaseapp.com",
  projectId: "ai-worksheet-g7",
  storageBucket: "ai-worksheet-g7.firebasestorage.app",
  messagingSenderId: "57789632933",
  appId: "1:57789632933:web:1128054ff11b66e785184c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.sendData = async function() {
  const name = document.getElementById("name").value;
  const answer = document.getElementById("answer").value;

  await addDoc(collection(db, "responses"), {
    name: name,
    answer: answer,
    time: new Date()
  });

  alert("✅ Sent to teacher!");
};
</script>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 40px;
}
input, textarea {
  padding: 10px;
  width: 300px;
  margin: 10px;
}
button {
  padding: 12px 20px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>

</head>

<body>

<h1>🤖 AI Worksheet Live</h1>

<input id="name" placeholder="Student Name"><br>

<textarea id="answer" placeholder="Write your answer here"></textarea><br>

<button onclick="sendData()">Send Live to Teacher</button>

</body>
</html>
